version: "3"

# Supporting infrastructure for running the application itself outside docker (e.g. in IntelliJ or via
# ./gradlew bootRun) with the `local` or `postgres-wiremock` profile. The app handles its own auth via
# DevSecurityConfig (HTTP Basic), so unlike docker-compose.yml this does not run hmpps-auth or the app.
services:
  probation-supervision-db:
    image: postgres:18
    networks:
      - hmpps
    container_name: probation-supervision-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_USER=postgres
      - POSTGRES_DB=probation-supervision

  wiremock:
    image: wiremock/wiremock:3.13.2
    networks:
      - hmpps
    container_name: wiremock
    ports:
      - "9090:8080"       # host:container - matches the `wiremock.port` used by application-local.yml
    environment:
      WIREMOCK_OPTIONS: "--verbose"
    volumes:
      - ./docker-wiremock/mappings:/home/wiremock/mappings

  local-stack-aws:
    # community-archive, not `latest`/a versioned tag: current LocalStack images are the licensed
    # Pro build and exit on startup without a LOCALSTACK_AUTH_TOKEN, which would break SQS/SNS here.
    image: localstack/localstack:community-archive
    networks:
      - hmpps
    container_name: local-stack-aws
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sns,sqs
      - DEBUG=${DEBUG- }
      - DATA_DIR=${DATA_DIR- }
      - PORT_WEB_UI=${PORT_WEB_UI- }
      - LAMBDA_EXECUTOR=${LAMBDA_EXECUTOR- }
      - KINESIS_ERROR_PROBABILITY=${KINESIS_ERROR_PROBABILITY- }
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AWS_EXECUTION_ENV=True
      - DEFAULT_REGION=eu-west-2
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"

networks:
  hmpps:
