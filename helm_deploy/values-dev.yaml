  env:
    APPLICATIONINSIGHTS_CONFIGURATION_FILE: "applicationinsights.dev.json"
    HMPPS_AUTH_URL: "https://sign-in-dev.hmpps.service.justice.gov.uk/auth"
    GOVUK-NOTIFY_TEMPLATEIDS_ENGLISH-WITH-NAME-DATE: "7a3c8a69-30fb-4361-8a3b-125be59aeddf"
    GOVUK-NOTIFY_TEMPLATEIDS_ENGLISH-WITH-NAME-DATE-LOCATION: "4280ea18-1fc6-4356-80a7-d5f0ed8aac4a"
    GOVUK-NOTIFY_TEMPLATEIDS_WELSH-WITH-NAME-DATE: "887554f6-7765-4df3-a77d-aa833b22116e"
    GOVUK-NOTIFY_TEMPLATEIDS_WELSH-WITH-NAME-DATE-LOCATION: "b562b777-0931-4f9d-bd6f-ef99a23bdef9"
    GOVUK-NOTIFY_TEMPLATEIDS_ENGLISH-WITH-APPOINTMENT-TYPE: "7d54eb38-d6c6-481b-9116-8ab1a100c531"
    GOVUK-NOTIFY_TEMPLATEIDS_ENGLISH-WITHOUT-APPOINTMENT-TYPE: "7a4c49af-70f2-4050-b856-7016193c9ec1"
    GOVUK-NOTIFY_TEMPLATEIDS_WELSH-WITH-APPOINTMENT-TYPE: "2207f3eb-b5d7-406a-b700-995e5040e2f7"
    GOVUK-NOTIFY_TEMPLATEIDS_WELSH-WITHOUT-APPOINTMENT-TYPE: "6f8975e1-58f3-4729-86ad-5140b1b72d29"
    SENTRY_ENVIRONMENT: dev
    OUTLOOK_ENVIRONMENT: dev
    SERVICES_SUPERVISION-API_BASE-URL: 'https://probation-supervision-appointments-api-dev.hmpps.service.justice.gov.uk'

# CloudPlatform AlertManager receiver to route prometheus alerts to slack
# See https://user-guide.cloud-platform.service.justice.gov.uk/documentation/monitoring-an-app/how-to-create-alarms.html#creating-your-own-custom-alerts
generic-prometheus-alerts:
  alertSeverity: manage-people-on-probation-dev
