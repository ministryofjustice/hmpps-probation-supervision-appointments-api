server:
  shutdown: immediate

wiremock:
  port: 9090

management.endpoint:
  health.cache.time-to-live: 0
  info.cache.time-to-live: 0

hmpps-auth:
  url: "http://localhost:8090/auth"

spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

graph-client:
  client-id: id
  client-secret: secret
  tenant-id: id

calendar-from-email: from@example.com

outlook-environment: dev

flipt:
  url: "http://localhost:8092"
  token:  "test-token"


govuk-notify:
  api-key: "test-api-key-test-api-key-test-api-key-"
  templateids:
    english-with-appointment-type: "7a3c8a69-30fb-4361-8a3b-125be59aeddf"
    english-without-appointment-type: "7a4c49af-70f2-4050-b856-7016193c9ec1"
    welsh-with-appointment-type: "2207f3eb-b5d7-406a-b700-995e5040e2f7"
    welsh-without-appointment-type: "6f8975e1-58f3-4729-86ad-5140b1b72d29"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true


hmpps.sqs:
  provider: localstack
  queues:
    domaineventsqueue:
      queueName: ${random.uuid}
      subscribeTopicId: hmppseventtopic
  topics:
    hmppseventtopic:
      arn: arn:aws:sns:eu-west-2:000000000000:${random.uuid}

services:
  supervision-api:
    base-url: http://localhost:9104
